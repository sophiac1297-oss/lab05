<!DOCTYPE html>
<html>
<head>
    <title>Mora, NM USA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.css" />
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.mjs';

   const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/positron',
    center: [-104.8149679297407, 36.03863327930246],   // [lng, lat]
    zoom: 9
});

window.map = map;

map.on('load', () => {
    map.addSource('usgs-topo', {
        type: 'raster',
        tiles: ['https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        attribution: 'USGS'
    });
    map.addLayer({
        id: 'usgs-topo-layer',
        type: 'raster',
        source: 'usgs-topo',
        paint: {
            'raster-opacity': 0.8
        }
    });
});

const marker = new maplibregl.Marker()
    .setLngLat([-105.01094125451569, 35.90505949374385])
    .addTo(map);

map.on('load', () => {

    map.addSource('cities', {
        type: 'geojson',
        data: 'data/nm_populated_places.geojson'
    });

    map.addLayer({
        id: 'cities-points',
        type: 'circle',
        source: 'cities',
        paint: {
            'circle-radius': 5,
            'circle-color': 'red'
        }
    });

     map.addSource('roads', {
        type: 'geojson',
        data: 'data/mora_county_roads.geojson'
    });

     map.addLayer({
        id: 'roads-lines',
        type: 'line',
        source: 'roads',
        paint: {
            'line-width': 2,
            'line-color': 'grey'
        }
    });
});
    </script>
</body>
</html>
